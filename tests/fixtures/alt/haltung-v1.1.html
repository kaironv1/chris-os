/* ---------- Tokens ---------- */
:root {
  color-scheme: light;
  --paper: #F1F2EE;
  --surface: #FFFFFF;
  --surface-2: #F7F8F5;
  --board: #E7E9E3;
  --ink: #1B2331;
  --ink-2: #485163;
  --muted: #646C7B;
  --line: #DCDFD8;
  --line-strong: #C3C8BF;
  --denim: #2F4E85;
  --denim-ink: #FFFFFF;
  --denim-wash: #E4EAF4;
  --olive: #56622B;
  --olive-wash: #E8EBDA;
  --cognac: #93501F;
  --cognac-wash: #F4E7DC;
  --rust: #9E3624;
  --c1: #3D63B0;
  --c2: #7E8F2E;
  --grid: #E9EBE6;
  --garment-line: rgba(27, 35, 49, .28);
  --shadow-pop: 0 10px 30px rgba(20, 28, 40, .16);
  --r-s: 8px; --r-m: 12px; --r-l: 18px;
  --rail: 232px;
  --font: 'Archivo', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #121822;
  --surface: #19212E;
  --surface-2: #1F2837;
  --board: #2A3447;
  --ink: #E9EBEF;
  --ink-2: #B7BECA;
  --muted: #949CAB;
  --line: #2A3344;
  --line-strong: #3B465A;
  --denim: #93AEE3;
  --denim-ink: #0F1724;
  --denim-wash: #233250;
  --olive: #B3BE79;
  --olive-wash: #2B3121;
  --cognac: #E3A06C;
  --cognac-wash: #3B2B20;
  --rust: #F0907A;
  --c1: #6F93D8;
  --c2: #8A9A3B;
  --grid: #263042;
  --garment-line: rgba(233, 235, 239, .30);
  --shadow-pop: 0 12px 34px rgba(0, 0, 0, .45);
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--denim); }
:focus-visible { outline: 2px solid var(--denim); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; font-weight: 620; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack > * + * { margin-top: 12px; }
.hidden { display: none !important; }

/* ---------- Shell ---------- */
.shell { min-height: 100vh; }
.rail {
  position: fixed; inset: 0 auto 0 0; width: var(--rail);
  padding: 26px 16px 20px; display: flex; flex-direction: column; gap: 4px;
  border-right: 1px solid var(--line); background: var(--paper); z-index: 20;
}
.brand { padding: 0 10px 22px; }
.brand-name { font-size: 25px; font-stretch: 72%; font-weight: 680; letter-spacing: .005em; }
.brand-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px;
  border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 520; position: relative;
}
.nav-item svg { width: 21px; height: 21px; flex: none; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 620; box-shadow: inset 0 0 0 1px var(--line); }
.nav-item .badge { margin-left: auto; }
.rail .spacer { flex: 1; }
.rail .rail-foot { font-size: 12px; color: var(--muted); padding: 10px 12px 0; line-height: 1.4; }
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 650;
  display: inline-flex; align-items: center; justify-content: center; background: var(--cognac); color: #fff;
}
:root[data-theme="dark"] .badge { color: #1a1206; }
main { margin-left: var(--rail); padding: 34px 40px 120px; }
.page { max-width: 1240px; margin: 0 auto; }
.tabbar { display: none; }

/* ---------- Page header ---------- */
.page-head { display: flex; align-items: flex-end; gap: 24px; justify-content: space-between; margin-bottom: 26px; flex-wrap: wrap; }
.page-title { font-size: 40px; font-stretch: 74%; font-weight: 640; letter-spacing: -.005em; line-height: 1; }
.page-sub { margin-top: 10px; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.day-pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; font-weight: 560; color: var(--ink); }
.day-pill svg { width: 16px; height: 16px; }
.wx { display: inline-flex; align-items: center; gap: 8px; }
.wx svg { width: 22px; height: 22px; color: var(--ink-2); }
.wx-temp { font-size: 17px; font-weight: 620; font-stretch: 85%; white-space: nowrap; }
.wx { flex-wrap: wrap; }
.wx > span { white-space: nowrap; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 40px); gap: 4px; }
.wd { height: 54px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6px; gap: 3px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 11.5px; color: var(--muted); }
.wd b { font-size: 14px; color: var(--ink); font-weight: 600; font-stretch: 85%; }
.wd.today { box-shadow: inset 0 0 0 2px var(--ink); }
.wd.past { background: transparent; }
.wd .marks { display: flex; gap: 2px; height: 12px; align-items: center; }
.wd .marks svg { width: 12px; height: 12px; }
.mk-gym { color: var(--c1); }
.mk-run { color: var(--c2); }
.mk-routine { color: var(--ink-2); }

/* ---------- Layout grids ---------- */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); gap: 22px; align-items: start; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

/* ---------- Panels ---------- */
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); }
.ledger > section { padding: 18px 20px; }
.ledger > section + section { border-top: 1px solid var(--line); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-title { font-size: 19px; font-stretch: 82%; font-weight: 640; }
.sec-meta { font-size: 13px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 18px 20px; }
.panel-quiet { background: var(--surface-2); border-radius: var(--r-m); padding: 14px 16px; }
.block-title { font-size: 22px; font-stretch: 80%; font-weight: 640; margin: 34px 0 14px; }
.block-title:first-child { margin-top: 0; }
.lead { color: var(--ink-2); max-width: 70ch; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 11px; border: 0; background: var(--denim); color: var(--denim-ink); font-weight: 620; white-space: nowrap; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.sm { height: 36px; padding: 0 14px; border-radius: 9px; font-size: 14px; }
.btn.quiet { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.quiet:hover { background: var(--surface-2); filter: none; }
.btn.ghost { background: transparent; color: var(--ink-2); padding: 0 10px; }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); filter: none; }
.btn.olive { background: var(--olive); color: #fff; }
:root[data-theme="dark"] .btn.olive { color: #161a0c; }
.btn.danger { background: transparent; color: var(--rust); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn svg { width: 18px; height: 18px; }
.btn.block { width: 100%; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="true"] { color: var(--denim); background: var(--denim-wash); }
.link-btn { border: 0; background: none; padding: 0; color: var(--denim); font-weight: 560; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

/* Segmented */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); flex-wrap: wrap; }
.seg button { height: 34px; padding: 0 13px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-weight: 540; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 640; box-shadow: 0 0 0 1px var(--line-strong); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; }
.tabs a { padding: 10px 14px 12px; color: var(--ink-2); text-decoration: none; font-weight: 540; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 640; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-2); font-size: 13.5px; font-weight: 540; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.tag.cognac { background: var(--cognac-wash); color: var(--cognac); box-shadow: none; }
.tag.olive { background: var(--olive-wash); color: var(--olive); box-shadow: none; }
.tag.denim { background: var(--denim-wash); color: var(--denim); box-shadow: none; }
.tag.rust { background: var(--cognac-wash); color: var(--rust); box-shadow: none; }

/* ---------- Check rows ---------- */
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; }
.checklist li + li { border-top: 1px solid var(--line); }
.check {
  width: 28px; height: 28px; flex: none; border-radius: 50%; border: 0; padding: 0;
  box-shadow: inset 0 0 0 1.5px var(--line-strong); background: transparent; color: transparent;
  display: inline-flex; align-items: center; justify-content: center; margin-top: -2px;
}
.check svg { width: 16px; height: 16px; }
.check:hover { box-shadow: inset 0 0 0 1.5px var(--olive); color: var(--olive); }
.check[aria-pressed="true"] { background: var(--olive); box-shadow: none; color: #fff; }
:root[data-theme="dark"] .check[aria-pressed="true"] { color: #161a0c; }
.check-body { flex: 1; min-width: 0; }
.check-name { font-weight: 540; }
li.done .check-name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.check-meta { font-size: 13px; color: var(--muted); margin-top: 1px; }
.check-meta.due { color: var(--cognac); font-weight: 560; }
.check-meta.over { color: var(--rust); font-weight: 600; }
details.how { margin-top: 6px; }
details.how summary { cursor: pointer; font-size: 13px; color: var(--denim); font-weight: 560; list-style: none; display: inline-flex; gap: 4px; align-items: center; }
details.how summary::-webkit-details-marker { display: none; }
details.how[open] summary { margin-bottom: 6px; }
.how-text { font-size: 14px; color: var(--ink-2); max-width: 62ch; }
.how-with { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* Meters */
.meter { height: 8px; border-radius: 4px; background: var(--denim-wash); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--c1); }
.meter.olive { background: var(--olive-wash); }
.meter.olive > i { background: var(--c2); }
.goal-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: center; font-size: 14px; }
.goal-row + .goal-row { margin-top: 8px; }

/* ---------- Outfit board (the one loud element) ---------- */
.board {
  position: relative; border-radius: var(--r-l); background: var(--board);
  padding: 20px 22px 18px; overflow: hidden;
}
.board::before { /* faint woven texture */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.018) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.018) 0 1px, transparent 1px 3px);
}
:root[data-theme="dark"] .board::before { background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px); }
.board > * { position: relative; }
.board-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.board-title { font-size: 21px; font-stretch: 80%; font-weight: 640; }
.lay { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 12px 14px; align-items: start; }
.lay-row { display: contents; }
.g { text-align: center; min-width: 0; position: relative; }
.g-art { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; }
.g-art svg { width: 100%; height: 100%; overflow: visible; }
.g-art img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; background: var(--surface); }
.g-cap { margin-top: 4px; font-size: 13px; font-weight: 560; line-height: 1.25; }
.g-sub { font-size: 12px; color: var(--muted); line-height: 1.3; }
.g-sub.g-brand { color: var(--ink-2); font-weight: 560; }
.g.unknown .g-art svg { opacity: .55; }
.g .g-wash { position: absolute; top: 2px; right: 2px; width: 30px; height: 30px; border-radius: 8px; border: 0; background: color-mix(in srgb, var(--surface) 80%, transparent); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; opacity: .8; transition: opacity .12s; }
.g:hover .g-wash, .g .g-wash:focus-visible, .g .g-wash[aria-pressed="true"] { opacity: 1; }
.g .g-wash[aria-pressed="true"] { color: var(--cognac); }
.g .g-wash svg { width: 17px; height: 17px; }
.lay.big .g-cap { font-size: 14px; }
.lay.small { gap: 6px 8px; }
.lay.small .g-cap, .lay.small .g-sub { display: none; }
.lay-split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start; }
.lay-split .lay.tops { --cols: 3; }
.lay-split .lay.bottoms { --cols: 2; }
.why { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.why li { font-size: 13px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 8px; padding: 4px 9px; }
.board-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
.board-actions .grow { flex: 1; }
.alts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.alt { border: 0; text-align: left; background: color-mix(in srgb, var(--surface) 62%, transparent); border-radius: 14px; padding: 10px 12px 10px; box-shadow: inset 0 0 0 1px transparent; }
.alt:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.alt-label { font-size: 12.5px; color: var(--muted); font-weight: 560; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.alt .lay { --cols: 5; }
.alt-items { font-size: 12.5px; line-height: 1.4; color: var(--ink-2); margin-top: 8px; }
.orow .alt-items { margin: 4px 0 2px; }
.worn-note { display: inline-flex; align-items: center; gap: 6px; color: var(--olive); font-weight: 620; }
.worn-note svg { width: 18px; height: 18px; }

/* ---------- Wardrobe grid ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.search { height: 36px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 12px; min-width: 200px; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.wcard { border: 0; padding: 10px 10px 12px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: left; position: relative; display: flex; flex-direction: column; }
.wcard:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.wcard .g-art { background: var(--board); border-radius: 10px; padding: 10px; }
.wcard .g-art img { background: transparent; }
.wcard-name { margin-top: 8px; font-weight: 600; font-size: 14px; line-height: 1.25; }
.wcard-sub { font-size: 12.5px; color: var(--muted); }
.wcard-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.wcard.laundry .g-art { opacity: .55; }
.wcard.wish { box-shadow: inset 0 0 0 1px var(--line-strong); background: transparent; border: 1px dashed var(--line-strong); }

/* Outfit list rows */
.olist { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.orow { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 10px; display: flex; flex-direction: column; }
.orow-art { background: var(--board); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
.orow-art .lay.small { gap: 4px 6px; }
.orow-name { font-weight: 620; line-height: 1.25; }
.orow-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.orow-actions { display: flex; gap: 2px; margin-top: auto; padding-top: 8px; align-items: center; }
.orow-actions .icon-btn { width: 36px; height: 36px; }
.orow.needs { background: transparent; border-style: dashed; }

/* ---------- Training ---------- */
.plan-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px 22px; }
.plan-name { font-size: 26px; font-stretch: 76%; font-weight: 650; }
.plan-focus { color: var(--ink-2); margin-top: 2px; }
.ex-list { list-style: none; margin: 16px 0 18px; padding: 0; }
.ex-list li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.ex-name { font-weight: 580; }
.ex-where { font-size: 12.5px; color: var(--muted); }
.ex-dose { text-align: right; font-variant-numeric: tabular-nums; font-stretch: 85%; font-weight: 600; white-space: nowrap; }
.ex-next { text-align: right; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.ex-next.up { color: var(--olive); font-weight: 600; }
.ss-bar { border-left: 2px solid var(--line-strong); padding-left: 10px; }
.focus-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.focus-haltung { background: var(--c2); }
.focus-aufbau { background: var(--c1); }
.focus-beides { background: linear-gradient(90deg, var(--c2) 50%, var(--c1) 50%); }

/* Session */
.session-head { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); padding: 14px 0 12px; margin: -14px 0 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.session-title { font-size: 28px; font-stretch: 74%; font-weight: 650; }
.clock { font-variant-numeric: tabular-nums; font-stretch: 80%; font-size: 20px; font-weight: 600; color: var(--ink-2); }
.exb { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px 18px; margin-bottom: 14px; }
.exb.ss { border-left: 4px solid var(--c1); }
.exb-head { display: flex; align-items: flex-start; gap: 10px; }
.exb-name { font-size: 20px; font-stretch: 80%; font-weight: 640; }
.exb-cue { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; max-width: 70ch; }
.sugg { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13.5px; padding: 6px 10px; border-radius: 9px; background: var(--surface-2); color: var(--ink-2); }
.sugg b { color: var(--ink); font-variant-numeric: tabular-nums; }
.sugg svg { width: 18px; height: 18px; flex: none; }
.sugg.up { background: var(--olive-wash); color: var(--olive); }
.sugg.up b { color: var(--olive); }
.sets { margin-top: 12px; display: grid; grid-template-columns: 54px minmax(90px, 140px) minmax(80px, 120px) 44px 1fr; gap: 8px 10px; align-items: center; }
.sets .h { font-size: 12px; color: var(--muted); font-weight: 560; }
.set-no { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; font-stretch: 85%; }
.num-in { height: 46px; width: 100%; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); text-align: center; font-size: 20px; font-weight: 620; font-stretch: 82%; font-variant-numeric: tabular-nums; }
.num-in::placeholder { color: var(--muted); font-weight: 450; opacity: .7; }
.num-in:focus { border-color: var(--denim); outline: none; box-shadow: 0 0 0 3px var(--denim-wash); }
.set-done .num-in { background: var(--olive-wash); border-color: transparent; color: var(--olive); }
.sets .check { width: 40px; height: 40px; }
.sets .check svg { width: 20px; height: 20px; }
.set-last { font-size: 12px; color: var(--muted); }
.exb-foot { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.warm { columns: 2; column-gap: 28px; }
.warm li { break-inside: avoid; }
.warm li + li { border-top: 0; }
.warm li { border-bottom: 1px solid var(--line); }

/* Rest timer */
.rest {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--paper); border-radius: 18px; padding: 10px 10px 10px 18px;
  display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-pop); margin-left: calc(var(--rail) / 2);
}
.rest-time { font-size: 30px; font-stretch: 75%; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 72px; }
.rest-label { font-size: 12.5px; opacity: .75; line-height: 1.2; }
.rest .btn { height: 38px; background: color-mix(in srgb, var(--paper) 16%, transparent); color: var(--paper); }
.rest.over { background: var(--olive); color: #fff; }

/* Charts */
.chart { position: relative; }
.chart svg { display: block; overflow: visible; }
.chart .axis { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--line-strong); stroke-width: 1; }
.chart .goal { stroke: var(--ink-2); stroke-width: 1; }
.chart .goal-label { font-size: 11.5px; fill: var(--ink-2); }
.chart .xhair { stroke: var(--line-strong); stroke-width: 1; }
.chart .endlabel { font-size: 12.5px; font-weight: 620; fill: var(--ink); font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; box-shadow: var(--shadow-pop); font-size: 12.5px; white-space: nowrap; z-index: 5; transform: translate(-50%, calc(-100% - 10px)); }
.tip b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
.tip .k { display: inline-block; width: 12px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 6px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
details.table-view { margin-top: 8px; }
details.table-view summary { font-size: 13px; color: var(--denim); cursor: pointer; font-weight: 560; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.segbar { display: flex; gap: 2px; height: 28px; border-radius: 6px; overflow: hidden; }
.segbar > i { display: block; height: 100%; border-radius: 4px; min-width: 3px; box-shadow: inset 0 0 0 1px var(--garment-line); }
.swatch-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.swatch-legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--sw); box-shadow: inset 0 0 0 1px var(--garment-line); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.stat-val { font-size: 30px; font-stretch: 78%; font-weight: 640; line-height: 1.05; }
.stat-label { font-size: 13px; color: var(--ink-2); margin-top: 2px; }

/* ---------- Forms ---------- */
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { height: 42px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 12px; width: 100%; }
.field textarea { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; }
.field input[type="range"] { padding: 0; height: 28px; border: 0; background: transparent; accent-color: var(--denim); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--denim); box-shadow: 0 0 0 3px var(--denim-wash); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.form-grid .full { grid-column: 1 / -1; }
.toggle { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--denim); }
.settings-list > div { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.settings-list > div:first-child { border-top: 0; }
.settings-list .lbl { font-weight: 580; }
.settings-list .hint { font-size: 13px; color: var(--muted); max-width: 60ch; }
.weekdays { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.weekdays label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.weekdays select { height: 36px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 6px; }
.inline-num { width: 72px; height: 38px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- Dialog ---------- */
dialog.sheet {
  border: 0; padding: 0; border-radius: 20px; background: var(--surface); color: var(--ink);
  width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow-pop);
}
dialog.sheet::backdrop { background: rgba(12, 16, 24, .42); }
.sheet-inner { padding: 22px 24px 20px; overflow: auto; max-height: calc(100vh - 48px); }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.sheet-title { font-size: 24px; font-stretch: 78%; font-weight: 650; flex: 1; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.sheet-foot .left { margin-right: auto; }
.photo-box { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center; margin-bottom: 18px; }
.photo-box .g-art { background: var(--board); border-radius: 12px; padding: 10px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); margin-left: calc(var(--rail) / 2); z-index: 80; background: var(--ink); color: var(--paper); padding: 10px 10px 10px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-pop); font-size: 14px; }
.toast button { border: 0; background: color-mix(in srgb, var(--paper) 16%, transparent); color: var(--paper); height: 32px; padding: 0 12px; border-radius: 8px; font-weight: 600; }
#rest:not(.hidden) ~ .toast { bottom: 100px; }

/* Empty + notes */
.empty { padding: 26px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line-strong); border-radius: 14px; }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--cognac-wash); color: var(--ink); font-size: 14px; }
.note svg { width: 20px; height: 20px; color: var(--cognac); flex: none; margin-top: 1px; }
.note.info { background: var(--denim-wash); }
.note.info svg { color: var(--denim); }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .today-grid { grid-template-columns: 1fr; }
  .three-col { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 960px) {
  body { font-size: 16px; }
  .rail { display: none; }
  main { margin-left: 0; padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: 11.5px; font-weight: 560; position: relative; }
  .tabbar a svg { width: 23px; height: 23px; }
  .tabbar a[aria-current="page"] { color: var(--ink); font-weight: 650; }
  .tabbar .badge { position: absolute; top: 0; left: calc(50% + 6px); min-width: 17px; height: 17px; font-size: 11px; padding: 0 4px; }
  .page-title { font-size: 32px; }
  .two-col, .three-col { grid-template-columns: 1fr; }
  .rest, .toast { margin-left: 0; bottom: calc(84px + env(safe-area-inset-bottom)); }

    home: '<path d="M4 11l8-6.5 8 6.5M6 9.5v10h12v-10"/>', free: '<path d="M5 19C5 11 10 6 19 6c0 9-5 13-13 13M5 19l7-7"/>',
    chev: '<path d="M9 5l7 7-7 7"/>', minus: '<path d="M5 12h14"/>'

  const ic = (k, cls) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${cls ? ` class="${cls}"` : ''}>${IC[k] || ''}</svg>`;

  // ---------- State ----------
  function load() {
    let st = null;
    try { st = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { st = null; }
    if (!st) {
      st = JSON.parse(document.getElementById('seed').textContent);
      const d = E.today();
      st.meta.setup = d;
      E.initGrooming(st, d);
      localStorage.setItem(KEY, JSON.stringify(st));
    }
    st.wardrobe.tempOverride = st.wardrobe.tempOverride || {};
    st.wardrobe.reroll = st.wardrobe.reroll || {};
    st.meta.dismissed = st.meta.dismissed || {};
    return st;
  }
  function save() {
    ver++; ui.memo = {};
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('Speichern fehlgeschlagen: Browser-Speicher voll? Bitte ein Backup anlegen.'); }
  }
  const item = id => S.wardrobe.items.find(i => i.id === id);
  const exById = id => S.training.exercises[id];
  function applyTheme() {
    const t = S.settings.theme;
    const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  }

  // ---------- Photos (IndexedDB) ----------
  const Photos = {
    db: null, urls: new Map(),
    open() {
      if (this.db) return Promise.resolve(this.db);
      return new Promise((res, rej) => {
        const r = indexedDB.open('haltung-fotos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('p');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      });
    },
    async run(mode, fn) {
      const db = await this.open();
      return new Promise((res, rej) => { const t = db.transaction('p', mode); const out = fn(t.objectStore('p')); t.oncomplete = () => res(out && 'result' in out ? out.result : undefined); t.onerror = () => rej(t.error); });
    },
    async loadAll() {
      try {
        const db = await this.open();
        await new Promise(res => { const req = db.transaction('p').objectStore('p').openCursor(); req.onsuccess = () => { const c = req.result; if (c) { this.urls.set(c.key, URL.createObjectURL(c.value)); c.continue(); } else res(); }; req.onerror = () => res(); });
      } catch (e) { /* storage unavailable */ }
    },
    async put(id, blob) { await this.run('readwrite', s => s.put(blob, id)); const o = this.urls.get(id); if (o) URL.revokeObjectURL(o); this.urls.set(id, URL.createObjectURL(blob)); },
    async del(id) { await this.run('readwrite', s => s.delete(id)); const o = this.urls.get(id); if (o) URL.revokeObjectURL(o); this.urls.delete(id); },
    async all() { const db = await this.open(); return new Promise(res => { const out = []; const req = db.transaction('p').objectStore('p').openCursor(); req.onsuccess = () => { const c = req.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); }; req.onerror = () => res(out); }); },
    async clear() { await this.run('readwrite', s => s.clear()); for (const u of this.urls.values()) URL.revokeObjectURL(u); this.urls.clear(); },
    url(id) { return this.urls.get(id) || null; }
  };
  async function shrink(file) {
    const bmp = await createImageBitmap(file);
    const max = 900, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Bild nicht lesbar')), 'image/jpeg', 0.84));
  }

  // ---------- Weather ----------
  function loadWx() { try { WX = JSON.parse(localStorage.getItem(WXKEY) || 'null'); } catch (e) { WX = null; } }
  async function fetchW(loc) {
    const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon +
      '&hourly=temperature_2m,apparent_temperature,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=3';
    const r = await fetch(u); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
  }
  async function refreshWeather(force) {
    const h = S.settings.home, o = S.settings.office;
    if (!h) return;
    const hk = h.lat + ',' + h.lon, ok = o ? o.lat + ',' + o.lon : '';
    if (!force && WX && WX.hk === hk && WX.ok === ok && Date.now() - WX.at < 45 * 60e3) return;
    try {
      const [home, office] = await Promise.all([fetchW(h), o ? fetchW(o) : Promise.resolve(null)]);
      WX = { at: Date.now(), hk, ok, home, office };
      try { localStorage.setItem(WXKEY, JSON.stringify(WX)); } catch (e) { /* ignore */ }
      ui.wxError = false; ui.memo = {};
      render();
    } catch (e) { ui.wxError = true; if (!WX) render(); }
  }

  // ---------- Outfit helpers ----------
  const occFor = d => ui.occ[d] || E.defaultOccasion(S, d);
  function ctxFor(d, occ) { return E.context(S, d, occ || occFor(d), WX); }
  function suggestionFor(d, occ) {
    const o = occ || occFor(d);
    const k = d + '|' + o + '|' + (ui.pick[d + '|' + o] || '') + '|' + ver + '|' + (WX ? WX.at : 0);
    if (!ui.memo[k]) { const ctx = ctxFor(d, o); ui.memo[k] = { ctx, res: E.suggest(S, ctx, { pick: ui.pick[d + '|' + o] }) }; }
    return ui.memo[k];
  }
  const wornOn = d => S.wardrobe.wear.filter(w => w.date === d).slice(-1)[0] || null;

  // ---------- Small render helpers ----------
  function art(it, opts) {
    const u = Photos.url(it.id);
    return u ? `<img src="${u}" alt="${esc(capF(it.label))}" loading="lazy">` : G.svg(it, opts);
  }
  // Brand as written by Alex, but all-lowercase words get a capital (e.g. "Silberfuchs" -> "Silberfuchs")
  const brandOf = it => String((it && it.brand) || '').trim().split(/\s+/).map(w => w && w === w.toLowerCase() && /^[a-zäöü]/.test(w) && w !== '&' ? w[0].toUpperCase() + w.slice(1) : w).join(' ');
  function subLines(it) {
    if (it.status === 'wunsch') return [brandOf(it) || 'Wunschliste', 'noch nicht gekauft'];
    const lines = [brandOf(it) || 'Marke offen'];
    if (it.nos && it.nos.length) lines.push('Nr. ' + it.nos.join(', ') + (it.qty > 1 && it.nos.length === 1 ? ' (' + it.qty + '×)' : ''));
    else if (it.unknownColor) lines.push('Farbe offen');
    return lines;
  }
  const sub = it => subLines(it).join(', ');
  // One line naming every piece of an outfit with its brand, for compact views
  function itemsLine(o) {
    const list = [o.outer, ...o.tops.slice().reverse(), o.bottom, o.shoes].filter(Boolean);
    return list.map(i => { const b = brandOf(i); return esc(capF(i.label)) + (b ? ' <span class="muted">(' + esc(b) + ')</span>' : ''); }).join(', ');
  }
  function gTile(it, opts) {
    opts = opts || {};
    if (!it) return '';
    const wash = opts.wash && it.role !== 'shoes' && !['cap', 'belt', 'watch'].includes(it.role)
      ? `<button class="g-wash" data-a="laundry" data-id="${it.id}" aria-pressed="${!!it.laundry}" aria-label="${it.laundry ? 'Ist in der Wäsche' : 'In die Wäsche'}: ${esc(it.label)}" title="${it.laundry ? 'In der Wäsche' : 'In die Wäsche'}">${ic('wash')}</button>` : '';
    const lines = subLines(it).concat(opts.note ? [opts.note] : []);
    return `<div class="g${it.unknownColor ? ' unknown' : ''}"><div class="g-art">${art(it)}</div><div class="g-cap">${esc(capF(it.label))}</div>${lines.map((l, i) => `<div class="g-sub${i === 0 ? ' g-brand' : ''}">${esc(l)}</div>`).join('')}${wash}</div>`;
  }
  function hintTile(label) {
    const fake = { cat: label === 'Winterjacke' ? 'Winterjacke' : 'Mantel', hex: '#8C877F', unknownColor: true, label };
    return `<div class="g unknown"><div class="g-art">${G.svg(fake)}</div><div class="g-cap">${esc(label)}</div><div class="g-sub">noch nicht erfasst</div></div>`;
  }
  function layout(o, opts) {
    opts = opts || {};
    if (!o) return '';
    const tops = o.tops.slice().reverse();
    const topsHtml = (o.outer ? gTile(o.outer, opts) : (o.outerHint ? hintTile(o.outerHint) : '')) + tops.map(t => gTile(t, Object.assign({}, opts, { note: (o.open && t === o.tops[o.tops.length - 1] && t.role === 'shirt') ? 'offen getragen' : null }))).join('');
    const nTop = tops.length + (o.outer || o.outerHint ? 1 : 0);
    const bottoms = [o.bottom, o.shoes, ...(o.acc || [])].filter(Boolean);
    if (opts.small) {
      const all = [...(o.outer ? [o.outer] : []), ...tops, ...bottoms.slice(0, 2)];
      return `<div class="lay small" style="--cols:${all.length}">${all.map(i => `<div class="g"><div class="g-art">${art(i)}</div></div>`).join('')}</div>`;
    }
    return `<div class="lay-split"><div class="lay tops${opts.big ? ' big' : ''}" style="--cols:${Math.max(2, nTop)}">${topsHtml}</div><div class="lay bottoms${opts.big ? ' big' : ''}" style="--cols:${Math.max(2, Math.min(3, bottoms.length))}">${bottoms.map(b => gTile(b, opts)).join('')}</div></div>`;
  }
  function seg(name, opts, val, extra) {
    return `<div class="seg" role="group" aria-label="${esc(name)}">${opts.map(([v, l]) => `<button data-a="${extra.a}" data-v="${v}"${extra.d ? ` data-d="${extra.d}"` : ''} aria-pressed="${v === val}">${esc(l)}</button>`).join('')}</div>`;
  }
  function wxIcon(code) { return ic(E.WMO(code).k); }
  function round(t) { return Math.round(t) + '°'; }

  // ---------- Outfit board ----------
  function board(d, opts) {
    opts = opts || {};
    const occ = occFor(d);
    const { ctx, res } = suggestionFor(d, occ);
    const worn = wornOn(d);
    const isToday = d === E.today();
    const title = opts.title || (isToday ? 'Outfit für heute' : 'Outfit für ' + (E.diffDays(E.today(), d) === 1 ? 'morgen' : E.fmtLong(d)));
    let body = '';
    if (worn) {
      const o = E.fromIds(S, worn.items, ctx);
      body = `${layout(o, { big: opts.big, wash: true })}
        <p class="small ink2" style="margin-top:12px">Was davon kommt in die Wäsche? Tippe auf den Korb am Teil. Wäsche-Teile schlägt die App erst wieder vor, wenn du sie zurücksetzt.</p>
        <div class="board-actions"><span class="worn-note">${ic('check')}Heute getragen</span><span class="grow"></span><button class="btn ghost sm" data-a="wear.undo" data-d="${d}">Rückgängig</button></div>`;
    } else if (!res.fav) {
      body = `<div class="empty">Für diesen Anlass findet die App gerade keine Kombination. Prüfe im Kleiderschrank, ob zu viele Teile in der Wäsche sind.</div>`;
    } else {
      const o = res.fav;
      const rated = S.wardrobe.ratings[o.key];
      body = `${layout(o, { big: opts.big })}
        <ul class="why">${o.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
        <div class="board-actions">
          ${isToday ? `<button class="btn olive" data-a="wear" data-d="${d}" data-k="${esc(o.key)}">${ic('check')}Heute getragen</button>` : ''}
          <button class="btn quiet" data-a="reroll" data-d="${d}">${ic('refresh')}Anderer Vorschlag</button>
          <span class="grow"></span>
          <button class="icon-btn" data-a="rate" data-d="${d}" data-k="${esc(o.key)}" data-v="1" aria-pressed="${rated === 1}" aria-label="Gefällt mir" title="Gefällt mir">${ic('up')}</button>
          <button class="icon-btn" data-a="rate" data-d="${d}" data-k="${esc(o.key)}" data-v="-1" aria-pressed="${rated === -1}" aria-label="Passt nicht, nicht mehr vorschlagen" title="Passt nicht">${ic('down')}</button>
        </div>
        ${res.alts.length ? `<div class="alts">${res.alts.map((a, i) => `<button class="alt" data-a="pick" data-d="${d}" data-k="${esc(a.key)}" aria-label="Alternative ${i + 1} übernehmen"><div class="alt-label"><span>Alternative ${i + 1}</span><span>übernehmen</span></div>${layout(a, { small: true })}<p class="alt-items">${itemsLine(a)}</p></button>`).join('')}</div>` : ''}`;
    }
    const occs = Object.entries(E.OCC).map(([k, v]) => [k, v.label]);
    return `<section class="board" aria-label="${esc(title)}">
      <div class="board-head"><h2 class="board-title">${esc(title)}</h2>${worn ? '' : seg('Anlass', occs, occ, { a: 'occ', d })}</div>
      ${body}
    </section>`;
  }

  // ---------- Header bits ----------
  function dayPill(d) {
    const t = S.settings.week[E.weekday(d)] || 'frei';
    const m = { buero: ['office', 'Bürotag'], ho: ['home', 'Homeoffice'], frei: ['free', 'Frei'] }[t];
    return `<span class="day-pill">${ic(m[0])}${m[1]}</span>`;
  }
  function wxLine(d) {
    const ctx = ctxFor(d);
    if (ctx.src === 'wetter' && ctx.home) {
      const w = ctx.home;
      const r = ctx.rain >= 40 ? `<span class="small">Regen bis ${Math.round(ctx.rain / 10) * 10} %</span>` : '';
      return `<span class="wx">${wxIcon(w.code)}<span class="wx-temp num">${round(w.tMin)} bis ${round(w.tMax)}</span><span class="small ink2">gefühlt ${round(ctx.tOut)} am Morgen${ctx.office ? ', ' + round(ctx.office.aDay) + ' am Büro' : ''}</span>${r}</span>`;
    }
    if (ctx.src === 'manuell') return `<span class="wx">${ic('timer')}<span class="small">Temperatur manuell: ${round(ctx.tOut)}</span></span>`;
    return `<span class="wx small ink2">${ic('cloud')}${ui.wxError ? 'Wetter gerade nicht erreichbar' : 'Wetter wird geladen'}, gerechnet mit ${round(ctx.tOut)}</span>`;
  }
  function weekStrip(d) {
    const ws = E.weekStart(d);
    const cells = [];
    for (let i = 0; i < 7; i++) {
      const x = E.addDays(ws, i);
      const gym = S.training.sessions.some(s => !s.imported && s.date === x);
      const run = S.training.runs.some(r => r.date === x);
      const rt = S.training.routineLog.some(r => r.date === x && r.id === 'haltung');
      const lbl = [gym && 'Gym', run && 'Laufen', rt && 'Haltungsroutine'].filter(Boolean).join(', ');
      cells.push(`<div class="wd${x === d ? ' today' : ''}${x < d ? ' past' : ''}" title="${E.fmtLong(x)}${lbl ? ': ' + lbl : ''}" aria-label="${E.fmtLong(x)}${lbl ? ': ' + lbl : ''}"><span>${E.WD[E.weekday(x)]}</span><b class="num">${E.parse(x).getDate()}</b><span class="marks">${gym ? ic('training', 'mk-gym') : ''}${run ? ic('run', 'mk-run') : ''}${rt ? ic('check', 'mk-routine') : ''}</span></div>`);
    }
    return `<div class="week" aria-label="Diese Woche">${cells.join('')}</div>`;
  }
  function backupNote() {
    const lb = S.meta.lastBackup;
    const age = lb ? E.diffDays(lb, E.today()) : E.diffDays(S.meta.setup || E.today(), E.today());
    if (!lb && S.meta.dismissed.welcome !== true) {
      return `<div class="note info" style="margin-bottom:20px">${ic('info')}<div class="grow"><b>Deine Daten bleiben in diesem Browser auf deinem PC.</b> Speichere ab und zu ein Backup (Einstellungen), dann ist nichts verloren, falls Browserdaten gelöscht werden.</div><button class="btn sm quiet" data-a="backup.export">Backup speichern</button><button class="icon-btn" data-a="dismiss" data-k="welcome" aria-label="Hinweis schließen">${ic('x')}</button></div>`;
    }
    if (age >= 14) return `<div class="note" style="margin-bottom:20px">${ic('alert')}<div class="grow">${lb ? 'Dein letztes Backup ist ' + age + ' Tage alt.' : 'Du hast noch kein Backup gespeichert.'} Ein Klick genügt.</div><button class="btn sm quiet" data-a="backup.export">Backup speichern</button></div>`;
    return '';
  }

  // ---------- Heute ----------
  function viewHeute() {
    const d = E.today();
    return `<div class="page">
      <header class="page-head">
        <div><h1 class="page-title">${E.fmtLong(d)}</h1><div class="page-sub">${dayPill(d)}${wxLine(d)}</div></div>
        ${weekStrip(d)}
      </header>
      ${backupNote()}
      <div class="today-grid">
        <div>${board(d)}</div>
        <div class="ledger">
          <section>${trainingToday(d)}</section>
          <section>${careToday(d)}</section>
          <section>${proteinToday(d)}</section>
        </div>
      </div>
    </div>`;
  }
  function goalRow(label, n, goal, cls) {
    const p = Math.min(100, Math.round(n / Math.max(1, goal) * 100));
    return `<div class="goal-row"><span>${label}</span><div class="meter ${cls || ''}" role="meter" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${n}" aria-label="${label}"><i style="width:${p}%"></i></div><span class="num small ink2">${n} von ${goal}</span></div>`;
  }
  function trainingToday(d) {
    const wc = E.weekCounts(S, d), g = S.settings.goals;
    const act = S.training.active;
    const np = S.training.plans.find(p => p.id === E.nextPlan(S));
    const last = E.sessionsSorted(S).find(s => !s.imported);
    const t = S.settings.week[E.weekday(d)];
    const breaks = S.training.routineLog.filter(r => r.date === d && r.id === 'buero').length;
    const routineToday = S.training.routineLog.some(r => r.date === d && r.id === 'haltung');
    let main;
    if (act) {
      const min = Math.round((Date.now() - act.start) / 60000);
      main = `<a class="btn block" href="#/training/session">${ic('play')}Training fortsetzen</a><p class="small muted" style="margin-top:6px">${esc(act.name)} läuft seit ${minText(min)}.</p>`;
    } else {
      main = `<button class="btn block" data-a="session.start" data-plan="${np.id}">${ic('play')}${esc(np.name)} starten</button><p class="small muted" style="margin-top:6px">Ca. ${np.minutes} Minuten. ${last ? 'Letztes Training: ' + esc(last.name) + ' ' + E.fmtRel(last.date) + '.' : 'Dein erstes Training mit dem neuen Plan.'}</p>`;
    }
    return `<div class="sec-head"><h2 class="sec-title">Training</h2><span class="sec-meta">KW ${E.isoWeek(d)}</span></div>
      <div style="margin-bottom:14px">${goalRow('Gym', wc.gym, g.gym)}${goalRow('Laufen', wc.run, g.run, 'olive')}${goalRow('Haltung', wc.routine, g.routine)}</div>
      ${main}
      <div class="row wrap" style="margin-top:10px">
        <button class="btn sm quiet" data-a="run.open">${ic('run')}Lauf eintragen</button>
        <button class="btn sm quiet" data-a="routine.open" data-id="haltung">${routineToday ? ic('check') : ic('timer')}Haltungsroutine${routineToday ? ' erledigt' : ', 7 Min.'}</button>
        ${t === 'buero' ? `<button class="btn sm quiet" data-a="routine.open" data-id="buero">Büro-Pause${breaks ? ' (' + breaks + '× heute)' : ', 2 Min.'}</button>` : ''}
      </div>`;
  }
  function careToday(d) {
    const hour = new Date().getHours();
    const slot = ui.slot || (hour < 14 ? 'morgens' : 'abends');
    const list = E.dailyTasks(S, d, slot);
    const done = list.filter(x => x.done && !x.optional).length, req = list.filter(x => !x.optional).length;
    const dueL = E.dueList(S, d);
    const next = S.grooming.tasks.filter(t => t.slot === 'rhythmus').map(t => ({ t, d: E.due(S, t, d) })).filter(x => x.d.diff > 0).sort((a, b) => a.d.diff - b.d.diff)[0];
    return `<div class="sec-head"><h2 class="sec-title">Pflege</h2><span class="sec-meta">${dueL.length ? dueL.length + ' fällig' : 'alles erledigt'}</span></div>
      <div class="row" style="justify-content:space-between;margin-bottom:4px">${seg('Tageszeit', [['morgens', 'Morgens'], ['abends', 'Abends']], slot, { a: 'slot' })}<span class="small muted num">${done} von ${req}</span></div>
      <ul class="checklist">${list.map(x => checkRow(x.t, x.done, 'daily', d, x.optional ? 'optional' : '', true)).join('')}</ul>
      ${dueL.length ? `<h3 class="small" style="margin:14px 0 2px;color:var(--ink-2)">Im Rhythmus fällig</h3><ul class="checklist">${dueL.map(x => checkRow(x.t, false, 'rhythm', d, dueText(x.d))).join('')}</ul>`
        : (next ? `<p class="small muted" style="margin-top:10px">Als Nächstes: ${esc(next.t.name)} ${E.fmtRel(next.d.date)}.</p>` : '')}`;
  }
  function dueText(du) {
    if (du.state === 'unknown') return 'Datum fehlt';
    if (du.diff < 0) return 'seit ' + (-du.diff) + (du.diff === -1 ? ' Tag' : ' Tagen') + ' fällig';
    if (du.diff === 0) return 'heute fällig';
    return 'fällig ' + E.fmtRel(du.date);
  }
  function checkRow(t, done, kind, d, meta, compact) {
    const metaCls = /seit/.test(meta) ? 'over' : /heute/.test(meta) ? 'due' : '';
    return `<li class="${done ? 'done' : ''}"><button class="check" data-a="${kind === 'daily' ? 'care.daily' : 'care.done'}" data-id="${t.id}" data-d="${d}" aria-pressed="${done}" aria-label="${esc(t.name)} ${done ? 'erledigt' : 'abhaken'}">${ic('check')}</button>
      <div class="check-body"><div class="check-name">${esc(t.name)}</div>${meta ? `<div class="check-meta ${metaCls}">${esc(meta)}</div>` : ''}
      ${t.how && !compact ? `<details class="how"><summary>Wie & Womit</summary><p class="how-text">${esc(t.how)}</p>${t.with ? `<p class="how-with">Womit: ${esc(t.with)}</p>` : ''}</details>` : ''}</div></li>`;
  }
  function proteinToday(d) {
    const g = S.training.protein[d] || 0, goal = S.settings.proteinGoal;
    const p = Math.min(100, Math.round(g / goal * 100));
    return `<div class="sec-head"><h2 class="sec-title">Eiweiß</h2><span class="sec-meta">Ziel ${goal} g</span></div>
      <div class="row" style="align-items:baseline;gap:12px"><span class="stat-val" style="font-size:28px">${g} g</span><span class="small muted">${g >= goal ? 'Ziel erreicht' : 'noch ' + (goal - g) + ' g'}</span></div>
      <div class="meter" style="margin:8px 0 12px" role="meter" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${g}" aria-label="Eiweiß heute"><i style="width:${p}%"></i></div>
      <div class="row wrap">
        ${[10, 20, 30].map(x => `<button class="btn sm quiet" data-a="protein.add" data-v="${x}" data-d="${d}">+${x} g</button>`).join('')}
        <select class="btn sm quiet" data-c="protein.food" data-d="${d}" aria-label="Lebensmittel hinzufügen" style="padding-right:8px"><option value="">Lebensmittel …</option>${S.training.foods.map((f, i) => `<option value="${i}">${esc(f.name)}, ca. ${f.g} g</option>`).join('')}</select>
        <button class="btn sm ghost" data-a="protein.edit" data-d="${d}">Korrigieren</button>
      </div>`;
  }

  // ---------- Training ----------
  const trTabs = sub => `<nav class="tabs" aria-label="Training">${[['', 'Plan'], ['verlauf', 'Verlauf'], ['fortschritt', 'Fortschritt']].map(([k, l]) => `<a href="#/training${k ? '/' + k : ''}" aria-current="${(sub || '') === k ? 'page' : 'false'}">${l}</a>`).join('')}</nav>`;
  function viewTraining(sub) {
    if (sub === 'session') return viewSession();
    const head = `<header class="page-head"><div><h1 class="page-title">Training</h1><p class="page-sub">2× Ganzkörper pro Woche, 60 % Haltung und 40 % Aufbau. Dazu 1× Laufen.</p></div></header>`;
    let body;
    if (sub === 'verlauf') body = viewHistory();
    else if (sub === 'fortschritt') body = viewProgress();
    else body = viewPlans();
    return `<div class="page">${head}${trTabs(sub)}${body}</div>`;
  }
  function doseText(ex) { return ex.sets + ' × ' + ex.repMin + '–' + ex.repMax + (ex.type === 'time' ? ' s' : '') + (ex.perSide ? ' je Seite' : ''); }
  function kgText(kg, ex) { if (ex.type === 'time') return ''; if (!kg) return 'Körpergewicht'; return n0(kg) + ' ' + (ex.unit === 'kg je Hand' ? 'kg je Hand' : 'kg'); }
  function viewPlans() {
    const act = S.training.active;
    const next = E.nextPlan(S);
    const plans = S.training.plans.map(p => {
      let prevSs = null;
      const lis = p.items.map(it => {
        const ex = exById(it.ex); const sg = E.suggestion(S, ex);
        const ssStart = it.ss && it.ss !== prevSs; prevSs = it.ss;
        return `<li${it.ss ? ' class="ss-bar"' : ''}><div><div class="ex-name"><span class="focus-dot focus-${ex.focus}" aria-hidden="true"></span>${esc(ex.name)}${it.optional ? ' <span class="tag">optional</span>' : ''}${ssStart ? ' <span class="tag denim">Supersatz</span>' : ''}</div><div class="ex-where">${esc(ex.where)}</div></div>
          <div><div class="ex-dose">${doseText(ex)}</div><div class="ex-next${sg.state === 'up' ? ' up' : ''}">${ex.type === 'time' ? 'nächstes Mal ' + sg.reps + ' s' : (sg.state === 'up' ? 'nächstes Mal ' : '') + kgText(sg.kg, ex)}</div></div></li>`;
      }).join('');
      return `<article class="plan-card"><div class="row" style="align-items:flex-start"><div class="grow"><h2 class="plan-name">${esc(p.name)}</h2><p class="plan-focus">${esc(p.focus)}, ca. ${p.minutes} Minuten</p></div>${p.id === next && !act ? '<span class="tag olive">als Nächstes</span>' : ''}</div>
        <ul class="ex-list">${lis}</ul>
        ${act ? (act.plan === p.id ? `<a class="btn block" href="#/training/session">Training fortsetzen</a>` : '') : `<button class="btn${p.id === next ? '' : ' quiet'} block" data-a="session.start" data-plan="${p.id}">${ic('play')}${esc(p.name)} starten</button>`}</article>`;
    }).join('');
    const legend = `<div class="legend" style="margin:-8px 0 18px"><span><span class="sw" style="background:var(--c2)"></span>Haltung</span><span><span class="sw" style="background:var(--c1)"></span>Aufbau</span><span class="muted">Supersatz: die Übungen abwechselnd, Pause erst nach beiden.</span></div>`;
    const r = S.training.routines;
    const lastRun = S.training.runs.slice().sort((a, b) => a.date < b.date ? 1 : -1)[0];
    return `${act ? `<div class="note info" style="margin-bottom:18px">${ic('timer')}<div class="grow">${esc(act.name)} läuft.</div><a class="btn sm" href="#/training/session">Fortsetzen</a></div>` : ''}
      ${legend}<div class="two-col">${plans}</div>
      <h2 class="block-title">Aufwärmen vor jedem Training, ca. 5 Minuten</h2>
      <div class="panel"><ul class="checklist warm">${S.training.warmup.map(w => `<li><div class="check-body"><div class="check-name">${esc(w.name)} <span class="muted num">${esc(w.dose)}</span></div><div class="check-meta">${esc(w.cue)}</div></div></li>`).join('')}</ul></div>
      <h2 class="block-title">Zwischendurch</h2>
      <div class="three-col">
        ${['haltung', 'buero'].map(k => `<div class="panel"><h3 style="font-size:18px;font-stretch:82%">${esc(r[k].name)}</h3><p class="small muted">${r[k].minutes} Minuten, ${esc(r[k].where)}</p><ul class="checklist" style="margin:10px 0 14px">${r[k].items.map(x => `<li><div class="check-body"><div class="check-name">${esc(x.name)} <span class="muted num">${esc(x.dose)}</span></div></div></li>`).join('')}</ul><button class="btn sm quiet" data-a="routine.open" data-id="${k}">${ic('play')}Starten</button></div>`).join('')}
        <div class="panel"><h3 style="font-size:18px;font-stretch:82%">Laufen</h3><p class="small muted">1× pro Woche, locker</p>
          <p class="small ink2" style="margin:10px 0">Locker laufen, so dass du dich noch unterhalten kannst; 25 bis 40 Minuten reichen. Bei Knick-, Senk- und Spreizfüßen lohnt ein Laufschuh mit leichter Stütze. Lass dich im Fachhandel oder beim Orthopäden beraten, ob Einlagen sinnvoll sind.</p>
          <p class="small muted" style="margin-bottom:12px">${lastRun ? 'Letzter Lauf: ' + E.fmtRel(lastRun.date) + ', ' + lastRun.min + ' Min.' + (lastRun.km ? ', ' + n0(lastRun.km) + ' km' : '') : 'Noch kein Lauf eingetragen.'}</p>
          <button class="btn sm quiet" data-a="run.open">${ic('run')}Lauf eintragen</button></div>
      </div>`;
  }

  function viewSession() {
    const a = S.training.active;
    if (!a) return `<div class="page"><div class="empty">Gerade läuft kein Training. <a href="#/training">Zum Plan</a></div></div>`;
    const done = a.entries.reduce((n, e) => n + e.sets.filter(s => s.done).length, 0);
    const total = a.entries.reduce((n, e) => n + e.sets.length, 0);
    const warmDone = Object.keys(a.warm || {}).length;
    let prevSs = null;
    const blocks = a.entries.map((e, ei) => {
      const ex = exById(e.ex);
      const sg = e.sugg || E.suggestion(S, ex);
      const last = E.lastEntry(S, ex.id);
      const ssStart = e.ss && e.ss !== prevSs; prevSs = e.ss;
      const alts = [ex.id, ...(exById(e.orig || e.ex).alts || [])].filter((v, i, arr) => arr.indexOf(v) === i);
      const origAlts = (exById(e.orig || e.ex).alts || []);
      const swapOpts = [e.orig || e.ex, ...origAlts].filter((v, i, arr) => arr.indexOf(v) === i);
      const time = ex.type === 'time';
      const rows = e.sets.map((st, si) => `
        <span class="set-no${st.done ? ' set-done' : ''}"><span class="sl">Satz </span>${si + 1}</span>
        <span class="${st.done ? 'set-done' : ''}">${time ? '<span class="muted small">—</span>' : `<input class="num-in" type="number" inputmode="decimal" step="0.5" min="0" value="${st.kg === '' || st.kg == null ? '' : st.kg}" placeholder="${sg.kg || 0}" data-i="set.kg" data-e="${ei}" data-s="${si}" aria-label="${esc(ex.name)} Satz ${si + 1} Gewicht in kg">`}</span>
        <span class="${st.done ? 'set-done' : ''}"><input class="num-in" type="number" inputmode="numeric" min="0" value="${st.reps == null ? '' : st.reps}" placeholder="${sg.reps}" data-i="set.reps" data-e="${ei}" data-s="${si}" aria-label="${esc(ex.name)} Satz ${si + 1} ${time ? 'Sekunden' : 'Wiederholungen'}"></span>
        <button class="check" data-a="set.done" data-e="${ei}" data-s="${si}" aria-pressed="${!!st.done}" aria-label="Satz ${si + 1} ${st.done ? 'erledigt' : 'abhaken'}">${ic('check')}</button>
        <span class="set-last">${last && last.sets[si] ? 'zuletzt ' + (time ? last.sets[si].reps + ' s' : n0(last.sets[si].kg) + ' × ' + last.sets[si].reps) : ''}</span>`).join('');
      return `<article class="exb${e.ss ? ' ss' : ''}" id="ex-${ei}">
        <div class="exb-head"><div class="grow"><h2 class="exb-name">${esc(ex.name)}</h2><p class="small muted">${esc(ex.where)}, ${doseText(ex)}${e.optional ? ', optional' : ''}${ssStart ? ', Supersatz mit der nächsten Übung' : ''}</p></div>
          <a class="icon-btn" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' Ausführung')}" target="_blank" rel="noopener" aria-label="Video zur Ausführung suchen" title="Video zur Ausführung">${ic('ext')}</a></div>
        <p class="exb-cue">${esc(ex.cue || '')}</p>
        <div class="sugg${sg.state === 'up' ? ' up' : ''}">${sg.state === 'up' ? ic('up') : ic('info')}<span>Vorschlag: <b>${time ? sg.reps + ' s' : kgText(sg.kg, ex) + ' × ' + sg.reps}</b>. ${esc(sg.why)}</span></div>
        <div class="sets"><span class="h">Satz</span><span class="h">${time ? '' : 'kg'}</span><span class="h">${time ? 'Sek.' : 'Wdh.'}</span><span class="h"></span><span class="h last">Letztes Mal</span>${rows}</div>
        <div class="exb-foot">
          <button class="btn sm ghost" data-a="set.add" data-e="${ei}">${ic('plus')}Satz</button>
          ${e.sets.length > 1 ? `<button class="btn sm ghost" data-a="set.remove" data-e="${ei}">${ic('minus')}Satz</button>` : ''}
          ${swapOpts.length > 1 ? `<label class="btn sm ghost" style="gap:6px">${ic('swap')}<span class="sr">Übung tauschen</span><select data-c="ex.swap" data-e="${ei}" style="border:0;background:transparent;font-weight:560" aria-label="Übung tauschen">${swapOpts.map(id => `<option value="${id}"${id === e.ex ? ' selected' : ''}>${id === e.ex ? 'Übung tauschen' : esc(exById(id).name)}</option>`).join('')}</select></label>` : ''}
        </div>
      </article>`;
    }).join('');
    return `<div class="page">
      <div class="session-head"><div class="grow"><h1 class="session-title">${esc(a.name)}</h1><p class="small muted"><span data-clock class="num">${minText(+clockText())}</span>, ${done} von ${total} Sätzen</p></div>
        <button class="btn ghost sm" data-a="session.discard">Verwerfen</button><button class="btn" data-a="session.finish">Training beenden</button></div>
      <details class="panel" style="margin-bottom:14px"${warmDone < S.training.warmup.length ? ' open' : ''}><summary style="cursor:pointer;font-weight:620">Aufwärmen <span class="muted small num">${warmDone} von ${S.training.warmup.length}</span></summary>
        <ul class="checklist" style="margin-top:8px">${S.training.warmup.map((w, i) => `<li class="${a.warm && a.warm[i] ? 'done' : ''}"><button class="check" data-a="warm" data-i="${i}" aria-pressed="${!!(a.warm && a.warm[i])}" aria-label="${esc(w.name)}">${ic('check')}</button><div class="check-body"><div class="check-name">${esc(w.name)} <span class="muted num">${esc(w.dose)}</span></div><div class="check-meta">${esc(w.cue)}</div></div></li>`).join('')}</ul></details>
      ${blocks}
      <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" data-a="session.finish">Training beenden</button></div>
    </div>`;
  }
  function clockText() { const a = S.training.active; if (!a) return '0'; return String(Math.floor((Date.now() - a.start) / 60000)); }

  function viewHistory() {
    const items = [];
    for (const s of S.training.sessions) items.push({ date: s.date, kind: 'gym', s });
    for (const r of S.training.runs) items.push({ date: r.date, kind: 'run', r });
    const rl = {};
    for (const r of S.training.routineLog) { const k = r.date + r.id; rl[k] = rl[k] || { date: r.date, kind: 'routine', id: r.id, n: 0 }; rl[k].n++; }
    items.push(...Object.values(rl));
    items.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
    if (!items.length) return `<div class="empty">Noch nichts eingetragen.</div>`;
    return `<div class="panel" style="padding:4px 20px"><ul class="checklist">${items.map(x => {
      if (x.kind === 'gym') {
        const st = E.sessionStats(x.s, S.training.exercises);
        return `<li><span class="check" aria-hidden="true" style="box-shadow:none;color:var(--c1)">${ic('training')}</span><div class="check-body"><div class="check-name">${esc(x.s.name)}</div><div class="check-meta">${E.fmtDate(x.date)}, ${st.sets} Sätze, Volumen ${n0(st.vol, 0)} kg${x.s.minutes ? ', ' + x.s.minutes + ' Min.' : ''}</div>
          <details class="how"><summary>Details</summary><table class="tbl"><tbody>${x.s.entries.filter(e => e.sets.some(s => s.done)).map(e => `<tr><td>${esc((exById(e.ex) || { name: e.ex }).name)}</td><td class="r">${e.sets.filter(s => s.done).map(s => (exById(e.ex) || {}).type === 'time' ? s.reps + ' s' : n0(s.kg) + ' × ' + s.reps).join(', ')}</td></tr>`).join('')}</tbody></table></details></div>
          ${x.s.imported ? '' : `<button class="icon-btn" data-a="session.delete" data-id="${x.s.id}" aria-label="Training löschen">${ic('trash')}</button>`}</li>`;
      }
      if (x.kind === 'run') return `<li><span class="check" aria-hidden="true" style="box-shadow:none;color:var(--c2)">${ic('run')}</span><div class="check-body"><div class="check-name">Laufen</div><div class="check-meta">${E.fmtDate(x.date)}, ${x.r.min} Min.${x.r.km ? ', ' + n0(x.r.km) + ' km' : ''}${x.r.feel ? ', ' + esc(x.r.feel) : ''}</div></div><button class="icon-btn" data-a="run.delete" data-id="${x.r.id}" aria-label="Lauf löschen">${ic('trash')}</button></li>`;
      return `<li><span class="check" aria-hidden="true" style="box-shadow:none">${ic('check')}</span><div class="check-body"><div class="check-name">${esc(S.training.routines[x.id].name)}${x.n > 1 ? ' ' + x.n + '×' : ''}</div><div class="check-meta">${E.fmtDate(x.date)}</div></div></li>`;
    }).join('')}</ul></div>`;
  }

  // ---------- Charts ----------
  function niceTicks(min, max, n) {
    if (min === max) { min -= 1; max += 1; }
    const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= step0) || 10 * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
    for (let v = lo; v <= hi + 1e-9; v += step) t.push(+v.toFixed(6));
    return t;
  }
  const CHARTS = {};
  const tickFmt = (t, step) => n0(t, step < 1 ? (step < 0.1 ? 2 : 1) : 0);
  function tableHtml(head, rows) { return `<details class="table-view"><summary>Werte als Tabelle</summary><table class="tbl"><thead><tr>${head.map((h, i) => `<th${i ? ' class="r"' : ''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td${i ? ' class="r"' : ''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`; }
  function lineChart(id, pts, opt) {
    if (!pts.length) return `<div class="empty small">Noch keine Daten.</div>`;
    CHARTS[id] = { type: 'line', pts, opt };
    return `<div class="chart" data-chart="line" data-id="${id}" tabindex="0" role="img" aria-label="${esc(opt.label)}. Mit den Pfeiltasten durch die Werte gehen."><div class="tip" style="display:none"></div></div>` + tableHtml(['Datum', opt.col || 'Wert'], pts.map(p => [p.x, p.tip]));
  }
  function barChart(id, bars, opt) {
    CHARTS[id] = { type: 'bar', bars, opt };
    const series = opt.series || [{ key: 'v', color: 'var(--c1)', name: opt.name || '' }];
    const legend = series.length > 1 ? `<div class="legend">${series.map(se => `<span><span class="sw" style="background:${se.color}"></span>${esc(se.name)}</span>`).join('')}</div>` : '';
    return `<div class="chart" data-chart="bar" data-id="${id}" role="img" aria-label="${esc(opt.label)}"><div class="tip" style="display:none"></div></div>${legend}` +
      tableHtml([opt.xcol || 'Zeitraum', ...series.map(se => se.name || opt.label)], bars.map(b => [b.label, ...series.map(se => n0(b[se.key] || 0, 0) + (opt.unit || ''))]));
  }
  function lineSVG(c, W) {
    const { pts, opt } = c, H = opt.h || 220, L = 44, R = 64, T = 14, B = 28;
    const ys = pts.map(p => p.y), lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = Math.max((hi - lo) * 0.15, opt.pad || 1);
    const ticks = niceTicks(lo - pad, hi + pad, 4), step = ticks[1] - ticks[0];
    const y0 = ticks[0], y1 = ticks[ticks.length - 1];
    const X = i => pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
    const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0 || 1));
    let g = ticks.map(t => `<line class="gridline" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${tickFmt(t, step)}</text>`).join('');
    const every = Math.max(1, Math.ceil(pts.length / Math.max(2, Math.floor((W - L - R) / 70))));
    g += pts.map((p, i) => (i % every === 0 || i === pts.length - 1) ? `<text class="axis" x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(p.x)}</text>` : '').join('');
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    const area = d + ` L${X(pts.length - 1).toFixed(1)} ${Y(y0)} L${X(0).toFixed(1)} ${Y(y0)} Z`;
    const last = pts[pts.length - 1];
    c.pos = pts.map((p, i) => ({ x: X(i), y: Y(p.y), t: p.tip }));
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${g}
      ${pts.length > 1 ? `<path d="${area}" fill="var(--c1)" opacity=".1"/><path d="${d}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
      ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
      <text class="endlabel" x="${X(pts.length - 1) + 10}" y="${Y(last.y) + 4}">${n0(last.y)} ${esc(opt.unit || '')}</text>
      <line class="xhair" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/></svg>`;
  }
  function barSVG(c, W) {
    const { bars, opt } = c, H = opt.h || 200, L = 36, R = 12, T = 18, B = 28;
    const series = opt.series || [{ key: 'v', color: 'var(--c1)', name: opt.name || '' }];
    const totals = bars.map(b => series.reduce((s2, se) => s2 + (b[se.key] || 0), 0));
    const maxV = Math.max(opt.goal || 0, ...totals, 1);
    const ticks = niceTicks(0, maxV, 3), y1 = ticks[ticks.length - 1], step = ticks[1] - ticks[0];
    const Y = v => T + (H - T - B) * (1 - v / y1);
    const slot = (W - L - R) / bars.length, bw = Math.min(24, slot * 0.6);
    const X = i => L + (i + 0.5) * slot;
    let g = ticks.map(t => `<line class="gridline" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${tickFmt(t, step)}</text>`).join('');
    g += `<line class="baseline" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
    const every = Math.max(1, Math.ceil(bars.length / Math.max(2, Math.floor((W - L - R) / 46))));
    const marks = bars.map((b, i) => {
      let acc = 0, out = '';
      const segs = series.filter(se => b[se.key] > 0);
      segs.forEach((se, si) => {
        const v = b[se.key], y = Y(acc + v), hh = Math.max(0, Y(acc) - Y(acc + v) - (si > 0 ? 2 : 0));
        const x = X(i) - bw / 2, top = si === segs.length - 1, r = Math.min(4, hh);
        out += top && hh > 0 ? `<path d="M${x} ${y + hh} V${y + r} Q${x} ${y} ${x + r} ${y} H${x + bw - r} Q${x + bw} ${y} ${x + bw} ${y + r} V${y + hh} Z" fill="${se.color}"/>` : `<rect x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${se.color}"/>`;
        acc += v;
      });
      const tip = series.map(se => (se.name ? se.name + ' ' : '') + n0(b[se.key] || 0, 0) + (opt.unit || '')).join(', ');
      return `<g class="bar" data-tip="${esc(b.label + ': ' + tip)}" tabindex="0" aria-label="${esc(b.label + ': ' + tip)}">${out}<rect x="${X(i) - slot / 2}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent"/></g>` +
        (i % every === 0 ? `<text class="axis" x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(b.short || b.label)}</text>` : '');
    }).join('');
    const goal = opt.goal ? `<line class="goal" x1="${L}" x2="${W - R}" y1="${Y(opt.goal)}" y2="${Y(opt.goal)}"/><text class="goal-label" x="${W - R}" y="${Y(opt.goal) - 6}" text-anchor="end">Ziel ${opt.goal}${opt.unit || ''}</text>` : '';
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${g}${goal}${marks}</svg>`;
  }
  function wireCharts() {
    document.querySelectorAll('.chart[data-id]').forEach(el => {
      const c = CHARTS[el.dataset.id]; if (!c) return;
      const W = Math.max(260, Math.floor(el.clientWidth));
      const old = el.querySelector('svg'); if (old) old.remove();
      el.insertAdjacentHTML('afterbegin', c.type === 'line' ? lineSVG(c, W) : barSVG(c, W));
      const tip = el.querySelector('.tip');
      if (el.dataset.wired) return;
      el.dataset.wired = '1';
      if (c.type === 'line') {
        let idx = c.pts.length - 1;
        const show = i => {
          const pos = c.pos; if (!pos || !pos.length) return; idx = Math.max(0, Math.min(pos.length - 1, i));
          const p = pos[idx], xh = el.querySelector('.xhair');
          xh.setAttribute('x1', p.x); xh.setAttribute('x2', p.x); xh.style.display = '';
          tip.textContent = ''; const b = document.createElement('b'); b.textContent = p.t; tip.appendChild(b);
          tip.style.left = p.x + 'px'; tip.style.top = p.y + 'px'; tip.style.display = '';
        };
        const hide = () => { tip.style.display = 'none'; const xh = el.querySelector('.xhair'); if (xh) xh.style.display = 'none'; };
        el.addEventListener('pointermove', ev => { const r = el.getBoundingClientRect(); const x = ev.clientX - r.left; let best = 0, bd = 1e9; c.pos.forEach((p, i) => { const dd = Math.abs(p.x - x); if (dd < bd) { bd = dd; best = i; } }); show(best); });
        el.addEventListener('pointerleave', hide); el.addEventListener('blur', hide); el.addEventListener('focus', () => show(idx));
        el.addEventListener('keydown', ev => { if (ev.key === 'ArrowLeft') { show(idx - 1); ev.preventDefault(); } if (ev.key === 'ArrowRight') { show(idx + 1); ev.preventDefault(); } });
      } else {
        const show = g => { const r = el.getBoundingClientRect(), br = g.getBoundingClientRect(); tip.textContent = g.dataset.tip; tip.style.left = (br.left - r.left + br.width / 2) + 'px'; tip.style.top = (br.top - r.top + 12) + 'px'; tip.style.display = ''; };
        el.addEventListener('pointerover', ev => { const g = ev.target.closest('.bar'); if (g) show(g); });
        el.addEventListener('focusin', ev => { const g = ev.target.closest('.bar'); if (g) show(g); });
        el.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
        el.addEventListener('focusout', () => { tip.style.display = 'none'; });
      }
    });
  }

  let lastRoute = '';

    const active = document.activeElement;
    const focusKey = active && active.dataset && (active.dataset.a || active.dataset.c || active.dataset.i) ? [active.dataset.a || active.dataset.c || active.dataset.i, active.dataset.id || '', active.dataset.e || '', active.dataset.s || '', active.dataset.v || '', active.dataset.k || ''].join('|') : null;
    $('#view').innerHTML = VIEWS[r.top](r.sub);
    if (rk !== lastRoute) window.scrollTo(0, 0); else window.scrollTo(0, scroll);

  // ---------- Rest timer ----------
  const rest = { end: 0, timer: null, name: '' };
  function startRest(sec, name) {
    rest.end = Date.now() + sec * 1000; rest.name = name; rest.over = false;
    const el = $('#rest'); el.classList.remove('hidden', 'over');
    clearInterval(rest.timer); rest.timer = setInterval(tickRest, 250); tickRest();
  }
  function tickRest() {
    const el = $('#rest'); const left = Math.ceil((rest.end - Date.now()) / 1000);
    if (left <= 0 && !rest.over) { rest.over = true; el.classList.add('over'); beep(); setTimeout(() => { if (rest.over) stopRest(); }, 9000); }
    const v = Math.max(0, left);
    el.querySelector('.rest-time').textContent = Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0');
    el.querySelector('.rest-label').textContent = rest.over ? 'Pause vorbei, weiter geht’s' : 'Pause nach ' + rest.name;
  }
  function stopRest() { clearInterval(rest.timer); rest.over = false; $('#rest').classList.add('hidden'); }
  function beep() {
    if (!S.settings.sound) return;
    try { const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC(); [0, 0.22].forEach(t0 => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.0001, ac.currentTime + t0); g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + 0.18); o.connect(g).connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + 0.2); }); setTimeout(() => ac.close(), 800); } catch (e) { /* no audio */ }
    if (navigator.vibrate) navigator.vibrate([180, 80, 180]);

  async function saveItem() {
    const f = new FormData($('#item-form'));

    Object.assign(it, {
      cat: v('cat'), brand: v('brand'), colorKey: v('colorKey'), pattern: v('pattern'), texture: v('texture'), fit: v('fit'),
      material: v('material').split(/[,;]/).map(x => x.trim()).filter(Boolean), nos: v('nos').split(/[,;\s]+/).map(Number).filter(n => n > 0),
      f: +v('f'), w: +v('w'), qty: Math.max(1, +v('qty') || 1), status: v('status'), notes: v('notes')
    });
    if (colorChanged || isNew) { delete it.hex; delete it.hex2; delete it.colorName; }
    delete it.role; delete it.group; delete it.seasons;
    const lbl = v('label');
    delete it.label;
    WP.derive(it);
    if (lbl) it.label = lbl;
    if (it.incomplete && !it.unknownColor && (it.brand || colorChanged)) it.incomplete = false;
    if (ui.pendingPhoto) { await Photos.put(it.id, ui.pendingPhoto); ui.pendingPhoto = null; }

  // ---------- Import ----------
  function importDialog() {
    openDialog(`${dlgHead('Kleiderliste importieren')}
      <p class="how-text">Wähle deine Excel-Datei (.xlsx), eine CSV-Datei oder eine Textdatei im bisherigen Format („1. T-Shirt von Marke“ und darunter „- weiß“). Outfit-Listen mit den Spalten Basis, Hose, Layer und Schuhe werden ebenfalls erkannt.</p>
      <label class="btn quiet" style="margin-top:14px">${ic('upload')}Datei wählen<input type="file" accept=".xlsx,.csv,.txt,text/plain,text/csv" data-c="import.file" class="sr"></label>
      <div id="imp-res" style="margin-top:16px"></div>`);
