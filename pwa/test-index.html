<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chris OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F4F1EB">
</head>
<body>
<main id="app">
  <h1>Chris OS</h1>
  <p id="state">App offen</p>
  <button id="setup" type="button">Fingerabdruck-Sperre einrichten</button>
  <button id="off" type="button">Sperre ausschalten</button>
  <div id="upd" hidden>Neue Version bereit <button id="apply" type="button">Jetzt laden</button></div>
</main>
<script src="lock.js"></script>
<script src="pwa.js"></script>
<script>
  localStorage.setItem('haltung.v1', JSON.stringify({ version: 4, demo: true }));
  const st = t => { document.getElementById('state').textContent = t; };
  Lock.init({ appName: 'Chris OS', grace: 60, onUnlock: () => st('Entsperrt') }).then(r => { window.__lockInit = r; });
  document.getElementById('setup').addEventListener('click', async () => { try { await Lock.enable(); st('Sperre aktiv'); } catch (e) { st('Fehler: ' + e.message); } });
  document.getElementById('off').addEventListener('click', async () => { const ok = await Lock.disable(); st(ok ? 'Sperre aus' : 'Nicht bestätigt'); });
  PWA.init({ onUpdate: apply => { document.getElementById('upd').hidden = false; document.getElementById('apply').onclick = apply; } });
</script>
</body>
</html>
